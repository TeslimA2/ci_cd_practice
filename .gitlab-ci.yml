stages:
  - validate

validate-sql:
  stage: validate
  image: bash:5.2
  script:
    - ./scripts/validate_sql.sh
    - ./scripts/create_validation_report.sh
  artifacts:
    paths:
      - output/validation-summary.txt
  rules:
    - changes:
        - sql/**/*
        - scripts/validate_sql.sh
        - scripts/create_validation_report.sh
        - .gitlab-ci.yml
    - when: manual
