name: SQL validation
on:
  pull_request:
    paths:
      - "sql/**"
      - "scripts/validate_sql.sh"
      - "scripts/create_validation_report.sh"
      - ".github/workflows/sql-validation.yml"
  push:
    branches:
      - main
    paths:
      - "sql/**"
      - "scripts/validate_sql.sh"
      - "scripts/create_validation_report.sh"
      - ".github/workflows/sql-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-sql:
    name: Validate SQL files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run SQL validation
        run: ./scripts/validate_sql.sh
      - name: Create validation report
        run: ./scripts/create_validation_report.sh
      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: sql-validation-report
          path: output/validation-summary.txt
