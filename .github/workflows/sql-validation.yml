name: Repository validation

on:
  pull_request:
    paths:
      - "sql/**"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "requirements-dev.txt"
      - ".github/workflows/sql-validation.yml"
  push:
    branches:
      - main
    paths:
      - "sql/**"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "requirements-dev.txt"
      - ".github/workflows/sql-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-sql:
    name: Validate SQL files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run SQL validation
        run: ./scripts/validate_sql.sh

      - name: Create SQL validation report
        run: ./scripts/create_validation_report.sh

      - name: Upload SQL validation report
        uses: actions/upload-artifact@v4
        with:
          name: sql-report
          path: output/validation-summary.txt
          if-no-files-found: error
          retention-days: 7

  test-python:
    name: Test with Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run unit tests
        run: ./scripts/run_unit_tests.sh

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-python-${{ matrix.python-version }}
          path: output/unit-tests.xml
          if-no-files-found: error
          retention-days: 7

  create-summary:
    name: Create combined validation summary
    runs-on: ubuntu-latest
    needs:
      - validate-sql
      - test-python
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download SQL validation report
        uses: actions/download-artifact@v4
        with:
          name: sql-report
          path: downloaded-artifacts/sql-report

      - name: Create pipeline summary
        run: ./scripts/create_pipeline_summary.sh

      - name: Upload pipeline summary
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-summary
          path: output/pipeline-summary.txt
          if-no-files-found: error
          retention-days: 7
